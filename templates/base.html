<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}在庫管理アプリ{% endblock %}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50 min-h-screen text-amber-900">

<!-- ヘッダー -->
<header class="bg-amber-800 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">

        <!-- タイトル -->
        <h1 class="text-xl font-bold">☕ 在庫管理アプリ</h1>

        <!-- 右側ボタン -->
        <nav class="flex gap-3">
            <a href="{{ url_for('home') }}"
               class="bg-white text-amber-800 px-4 py-2 rounded-lg font-semibold shadow hover:bg-amber-100">
               在庫一覧
            </a>

            <a href="{{ url_for('index') }}"
               class="bg-white text-amber-800 px-4 py-2 rounded-lg font-semibold shadow hover:bg-amber-100">
               管理しているもの
            </a>
        </nav>

    </div>
</header>

<!-- メイン -->
<main class="max-w-5xl mx-auto p-4">
    {% block content %}{% endblock %}
</main>

</body>
</html>
