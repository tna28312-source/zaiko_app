{% extends "base.html" %}

{% block title %}商品編集{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-6">商品編集</h2>

<div class="bg-white rounded-xl shadow p-6 max-w-lg">

  <form method="post" action="{{ url_for('edit_material', id=material.material_id) }}" class="space-y-4">

    <!-- 商品名 -->
    <div>
      <label class="block text-sm font-medium mb-1">商品名</label>
      <input type="text" name="name" value="{{ material.material_name }}" required
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>

    <!-- 単位 -->
    <div>
      <label class="block text-sm font-medium mb-1">単位（例：ml, g, 個）</label>
      <input type="text" name="unit" value="{{ material.unit }}" required
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>

    <!-- 最低在庫 -->
    <div>
      <label class="block text-sm font-medium mb-1">最低在庫量</label>
      <input type="number" step="0.1" name="min_stock" value="{{ material.min_stock }}"
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>

    <!-- ボタン -->
    <div class="pt-2 flex gap-3">
      <button type="submit"
              class="px-4 py-2 bg-amber-700 text-white rounded-lg shadow hover:bg-amber-800">
        更新する
      </button>

      <a href="{{ url_for('index') }}"
         class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
        ← 戻る
      </a>
    </div>

  </form>
</div>

{% endblock %}
