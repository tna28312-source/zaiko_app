{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center gap-4">
  {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="mb-4 p-3 bg-green-100 border border-green-300 text-green-800 rounded-lg text-sm">
      {{ messages[0] }}
    </div>
  {% endif %}
  {% endwith %}
  <!-- ★ 新規登録ボタン（上に配置・大きく） -->
  <a href="{{ url_for('register') }}"
     class="px-6 py-3 bg-amber-600 text-white text-lg font-bold rounded-xl shadow-md hover:bg-amber-700">
     ユーザー登録まだの人はこちら
  </a>

  <!-- ログイン枠 -->
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6">
      ログイン
    </h2>

    {% if error %}
      <div class="mb-4 p-3 bg-red-100 border border-red-300 text-red-700 rounded-lg text-sm">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">

      <div>
        <label class="block text-sm font-medium mb-1">ユーザー名</label>
        <input type="text" name="username" required
          class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">パスワード</label>
        <input type="password" name="password" required
          class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500">
      </div>

      <button type="submit"
        class="w-full py-3 bg-amber-700 text-white text-lg font-semibold rounded-lg hover:bg-amber-800">
        ログイン
      </button>

    </form>

  </div>
</div>
{% endblock %}
