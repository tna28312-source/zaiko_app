{% extends "base.html" %}

{% block title %}ユーザー登録{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6">
      ユーザー登録
    </h2>

    {% if error %}
      <div class="mb-4 p-3 bg-red-100 border border-red-300 text-red-700 rounded-lg text-sm">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">

      <div>
        <label class="block text-sm font-medium mb-1">ユーザー名</label>
        <input
          type="text"
          name="username"
          required
          class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500"
        >
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">パスワード</label>
        <input
          type="password"
          name="password"
          required
          class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500"
        >
      </div>

      <button
        type="submit"
        class="w-full py-2 bg-amber-700 text-white rounded-lg font-semibold hover:bg-amber-800"
      >
        登録する
      </button>

    </form>
  </div>
</div>
{% endblock %}
